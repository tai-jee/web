name: Deploy

on:
    push:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest
        name: Build
        steps:
            - name: Checkout site repo
              uses: actions/checkout@v7
              with:
                  path: site

            - name: Checkout content repo
              uses: actions/checkout@v7
              with:
                  repository: tai-jee/web-content
                  path: content

            - name: Install dependencies
              working-directory: site
              run:
                  if [ -f package-lock.json ]; then npm ci; else npm install; fi

            - name: Build
              working-directory: site
              run: npm run build

    deploy:
        runs-on: ubuntu-latest
        needs: build
        name: Deploy
        steps:
            - name: Deploy
              working-directory: site
              run: npm run deploy
