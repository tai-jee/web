services:
  site:
    image: nginx:alpine
    volumes:
      - ./html:/usr/share/nginx/html
    networks:
      - internal

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    environment:
      - TUNNEL_TOKEN
    depends_on:
      - site
    networks:
      - internal

networks:
  internal:
