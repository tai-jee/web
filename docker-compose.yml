services:
    site:
        build: .
        networks:
            - internal
        restart: unless-stopped

    cloudflared:
        image: cloudflare/cloudflared:latest
        command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
        environment:
            - TUNNEL_TOKEN
        depends_on:
            - site
        networks:
            - internal
        restart: unless-stopped

networks:
    internal:
